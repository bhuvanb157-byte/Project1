<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>udayamX - Government Scheme Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SCREEN 1: HOMEPAGE WELCOME SCREEN -->
    <div id="landingPage" class="page fade-in">
        <div class="landing-container">
            <h1 class="logo-title">udayamX</h1>
            <p class="quote">"The best way to predict the future is to create it. Empowering your entrepreneurial journey."</p>
            <button class="btn-primary" type="button" onclick="navigateTo('questionnairePage')">Get Started</button>
        </div>
    </div>

    <!-- SCREEN 2: APPLICATION QUESTION PROFILE -->
    <div id="questionnairePage" class="page hidden">
        <div class="form-container">
            <h2>Find Funding Schemes For Your Startup</h2>
            <form id="schemeForm" onsubmit="handleFormSubmit(event)">
                
                <div class="form-group">
                    <label for="age">Select Your Age</label>
                    <input type="number" id="age" name="age" min="18" max="100" placeholder="e.g. 25" required>
                </div>

                <div class="form-group">
                    <label for="state">Select Your State / UT</label>
                    <select id="state" name="state" required>
                        <option value="">-- Choose State --</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Chhattisgarh">Chhattisgarh</option>
                        <option value="Goa">Goa</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Himachal Pradesh">Himachal Pradesh</option>
                        <option value="Jharkhand">Jharkhand</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Manipur">Manipur</option>
                        <option value="Meghalaya">Meghalaya</option>
                        <option value="Mizoram">Mizoram</option>
                        <option value="Nagaland">Nagaland</option>
                        <option value="Odisha">Odisha</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Sikkim">Sikkim</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Tripura">Tripura</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Uttarakhand">Uttarakhand</option>
                        <option value="West Bengal">West Bengal</option>
                        <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                        <option value="Chandigarh">Chandigarh</option>
                        <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                        <option value="Ladakh">Ladakh</option>
                        <option value="Lakshadweep">Lakshadweep</option>
                        <option value="Puducherry">Puducherry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="caste">Select Social Category (Caste Group)</label>
                    <select id="caste" name="caste" required>
                        <option value="">-- Choose Category --</option>
                        <option value="General">General Category</option>
                        <option value="OBC">OBC (Other Backward Classes)</option>
                        <option value="SC">SC (Scheduled Caste)</option>
                        <option value="ST">ST (Scheduled Tribe)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="education">Education (Studied Upto)</label>
                    <select id="education" name="education" required>
                        <option value="">-- Choose Education Level --</option>
                        <option value="Under Matric">Below 10th Standard</option>
                        <option value="12th Pass">10th / 12th Standard Pass</option>
                        <option value="Diploma/ITI">Diploma / ITI Certificate Holder</option>
                        <option value="Graduate">College Graduate</option>
                        <option value="Post Graduate">Post Graduate & Higher</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="businessType">Enter Business Type</label>
                    <input type="text" id="businessType" name="businessType" placeholder="e.g. Technology, Agriculture, Textile" required>
                </div>

                <div class="form-group">
                    <label for="budget">Estimated Startup Budget</label>
                    <select id="budget" name="budget" required>
                        <option value="">-- Choose Budget Range --</option>
                        <option value="low">Under ₹5 Lakhs</option>
                        <option value="mid">₹5 Lakhs - ₹25 Lakhs</option>
                        <option value="high">Above ₹25 Lakhs</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="navigateTo('landingPage')">Back</button>
                    <button type="submit" class="btn-primary">Find Schemes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCREEN 3: RESULTS CONTAINER VIEW -->
    <div id="resultsPage" class="page hidden">
        <div class="results-container">
            <h2>Matching Government Schemes For You</h2>
            <div id="activeFilters" class="filter-badges-container"></div>
            <div id="schemesList" class="schemes-grid"></div>
            <button class="btn-secondary" type="button" onclick="navigateTo('questionnairePage')" style="margin-top: 2rem; width: 100%;">Back to Questionnaire</button>
        </div>
    </div>

    <!-- CLEAN MODULAR ASSET LOADING INVOCATION ROUTINE -->
    <script src="script.js"></script>
</body>
</html>
